<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Obsidian) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1E2B" />
      <stop offset="50%" stop-color="#141620" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>

    <!-- TikTok Cyan & Red Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="100%" stop-color="#00C7FF" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF004F" />
      <stop offset="100%" stop-color="#FE2C55" />
    </linearGradient>

    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3142" />
      <stop offset="100%" stop-color="#1A1C27" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#2B2F42" stroke-width="4" />

  <!-- Inner Ambient Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Sticker Peeling / Folded Card Effect -->
  <g transform="translate(106, 86)">
    <!-- Cyan Drop Shadow Layer (TikTok chromatic offset) -->
    <path d="M 40 10 
             L 220 10 
             A 30 30 0 0 1 250 40 
             L 250 190 
             L 190 250 
             L 40 250 
             A 30 30 0 0 1 10 220 
             L 10 40 
             A 30 30 0 0 1 40 10 Z" 
          fill="none" stroke="#25F4EE" stroke-width="6" opacity="0.6" transform="translate(-4, -3)" />

    <!-- Red Drop Shadow Layer (TikTok chromatic offset) -->
    <path d="M 40 10 
             L 220 10 
             A 30 30 0 0 1 250 40 
             L 250 190 
             L 190 250 
             L 40 250 
             A 30 30 0 0 1 10 220 
             L 10 40 
             A 30 30 0 0 1 40 10 Z" 
          fill="none" stroke="#FE2C55" stroke-width="6" opacity="0.6" transform="translate(4, 3)" />

    <!-- Main Sticker Body -->
    <path d="M 40 10 
             L 220 10 
             A 30 30 0 0 1 250 40 
             L 250 190 
             L 190 250 
             L 40 250 
             A 30 30 0 0 1 10 220 
             L 10 40 
             A 30 30 0 0 1 40 10 Z" 
          fill="#181A24" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Peeling Corner Triangle (Fold) -->
    <path d="M 190 250 L 190 200 A 10 10 0 0 1 200 190 L 250 190 Z" 
          fill="url(#foldGrad)" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Center Download & Play Arrow Symbol -->
    <g transform="translate(130, 115)">
      <!-- Download Arrow Stem -->
      <path d="M 0 -45 L 0 20" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
      <!-- Download Arrow Head -->
      <path d="M -28 -5 L 0 22 L 28 -5" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Base Download Tray / Arc -->
      <path d="M -42 42 L 42 42" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" />
    </g>
  </g>

  <!-- Accent Badges (Telegram & VP9 format indicators) -->
  <!-- WebP/WebM Pill Badge -->
  <g transform="translate(146, 385)">
    <rect x="0" y="0" width="102" height="34" rx="17" fill="#142536" stroke="#2AABEE" stroke-width="1.5" />
    <text x="51" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#2AABEE" text-anchor="middle" letter-spacing="1">WEBM</text>
  </g>

  <g transform="translate(264, 385)">
    <rect x="0" y="0" width="102" height="34" rx="17" fill="#2A1620" stroke="#FE2C55" stroke-width="1.5" />
    <text x="51" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FE2C55" text-anchor="middle" letter-spacing="1">WEBP</text>
  </g>
</svg>
